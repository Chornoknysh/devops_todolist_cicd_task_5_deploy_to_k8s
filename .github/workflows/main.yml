name: python-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  PythonVersion: 3.8
  DockerImageName: danyil/django-todo

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PythonVersion }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt
        working-directory: ./todoapp

      - name: Run tests
        run: python manage.py test
        working-directory: ./todoapp

      - name: Coverage report
        run: |
          coverage run --source='.' manage.py test
          coverage report
        working-directory: ./todoapp

      - name: Linting
        run: flake8 . --show-source --statistics --exit-zero
        working-directory: ./todoapp

      - name: Check complexity
        run: flake8 . --exit-zero --max-complexity=6
        working-directory: ./todoapp

  docker-ci:
    runs-on: ubuntu-latest
    needs: python-ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./todoapp
          file: ./todoapp/Dockerfile
          push: true
          tags: |
            ${{ env.DockerImageName }}:${{ github.sha }}
            ${{ env.DockerImageName }}:latest

  deploy-dev:
    runs-on: ubuntu-latest
    needs: docker-ci
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kind and kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          sudo apt-get update && sudo apt-get install -y kubectl

      - name: Create kind cluster (dev)
        run: kind create cluster --name todo-dev --config ./deploy/cluster.yml

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Helm dry-run install (dev)
        run: |
          helm dependency update ./helm-charts || true
          helm install todo-dev ./helm-charts \
            --namespace todo-dev --create-namespace \
            --set image.repository=${{ env.DockerImageName }} \
            --set image.tag=${{ github.sha }} \
            --dry-run

      - name: Helm upgrade --install (dev)
        run: |
          helm upgrade --install todo-dev ./helm-charts \
            --namespace todo-dev --create-namespace \
            --set image.repository=${{ env.DockerImageName }} \
            --set image.tag=${{ github.sha }} \
            --atomic --wait --timeout 5m

  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-ci
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kind and kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          sudo apt-get update && sudo apt-get install -y kubectl

      - name: Create kind cluster (staging)
        run: kind create cluster --name todo-staging --config ./deploy/cluster.yml

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Helm dry-run install (staging)
        run: |
          helm dependency update ./helm-charts || true
          helm install todo-staging ./helm-charts \
            --namespace todo-staging --create-namespace \
            --set image.repository=${{ env.DockerImageName }} \
            --set image.tag=${{ github.sha }} \
            --dry-run

      - name: Helm upgrade --install (staging)
        run: |
          helm upgrade --install todo-staging ./helm-charts \
            --namespace todo-staging --create-namespace \
            --set image.repository=${{ env.DockerImageName }} \
            --set image.tag=${{ github.sha }} \
            --atomic --wait --timeout 5m